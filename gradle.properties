org.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8 -XX:+UseZGC -XX:+UnlockExperimentalVMOptions -XX:ZAllocationSpikeTolerance=5
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
org.gradle.java.installations.auto-download=true
android.suppressUnsupportedCompileSdk=35,36,37

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# NOTE: do NOT commit a machine-specific org.gradle.java.home here.
# The previous value pointed at a Windows JDK path (C:/Users/tlarsen/...)
# which broke every Linux/macOS/CI clone. Configure the Gradle JDK via
# GRADLE_LOCAL_JAVA_HOME / JAVA_HOME / -Dorg.gradle.java.home on the machine
# that builds, not in the committed file.

