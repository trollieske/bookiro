name: iOS Build

on:
  push:
    branches: [ kmp-ios, ios-parity ]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: gradle-ios-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-ios-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Xcode version
        run: xcodebuild -version

      - name: Build Shared framework (iOS simulator)
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Build Shared framework (iOS device)
        run: ./gradlew :shared:linkDebugFrameworkIosArm64 --stacktrace

      - name: Stage frameworks for CI linking
        run: |
          mkdir -p shared/build/ci-frameworks/Debug/iphonesimulator
          mkdir -p shared/build/ci-frameworks/Debug/iphoneos
          cp -R shared/build/bin/iosSimulatorArm64/debugFramework/Shared.framework shared/build/ci-frameworks/Debug/iphonesimulator/
          cp -R shared/build/bin/iosArm64/debugFramework/Shared.framework shared/build/ci-frameworks/Debug/iphoneos/

      - name: Build iosApp for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build

      - name: Build iosApp for iOS device
        run: |
          set -o pipefail
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build

      - name: Upload simulator app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Bookrio-ios-simulator-app
          path: ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/*.app
          if-no-files-found: ignore

      - name: Boot iOS Simulator
        if: success()
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[dev for rt in d for dev in d[rt] if dev.get('isAvailable') and 'iPhone' in dev.get('name','')]; print(c[0]['udid'])")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      # Real runtime check: install the built app, seed the sample PDF, then launch
      # it with BOOKRIO_AUTO_OPEN_PDF so the native UIPageViewController(.pageCurl)
      # reader is on screen when the screenshot is taken.
      - name: Smoke-run app on Simulator (auto-open sample PDF)
        if: success()
        run: |
          set -euo pipefail
          APP=$(find "$HOME/Library/Developer/Xcode/DerivedData" -maxdepth 8 -path "*Build/Products/Debug-iphonesimulator/*.app" | head -1)
          echo "Installing: $APP"
          xcrun simctl install "$SIM_UDID" "$APP"
          CONTAINER=$(xcrun simctl get_app_container "$SIM_UDID" com.bookrio.ios data)
          mkdir -p "$CONTAINER/Documents/books"
          cp tools/ci/sample.pdf "$CONTAINER/Documents/books/sample.pdf"
          SIMCTL_CHILD_BOOKRIO_AUTO_OPEN_PDF="$CONTAINER/Documents/books/sample.pdf" \
            xcrun simctl launch --console-pty "$SIM_UDID" com.bookrio.ios > /tmp/app-console.log 2>&1 &
          SIMCTL_PID=$!
          sleep 20
          if ! kill -0 "$SIMCTL_PID" 2>/dev/null; then
            echo "::error::App exited early (likely crashed before the screenshot)"
            cat /tmp/app-console.log
            exit 1
          fi
          xcrun simctl io "$SIM_UDID" screenshot /tmp/bookrio-reader.png
          echo "--- app console (tail) ---"
          tail -80 /tmp/app-console.log
          if grep -q "Uncaught Kotlin exception" /tmp/app-console.log; then
            echo "::error::Uncaught Kotlin exception in the app (see console above)"
            exit 1
          fi
          if ! grep -q "presentPdfReader=true" /tmp/app-console.log; then
            echo "::error::Native page-curl reader was not presented (see console above)"
            exit 1
          fi
          echo "OK: native page-curl reader presented on the simulator"

      # EPUB runtime check: generate a tiny deflated EPUB (python3 stdlib, no new
      # dependency), then launch the app with BOOKRIO_AUTO_OPEN_EPUB so the same
      # native page-curl host renders EPUB pages. This exercises the Kotlin/Native
      # zlib raw-inflate path that cross-compilation alone cannot prove.
      - name: Smoke-run app on Simulator (auto-open sample EPUB)
        if: success()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          container = ('<?xml version="1.0"?>'
            '<container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">'
            '<rootfiles><rootfile full-path="OEBPS/content.opf" '
            'media-type="application/oebps-package+xml"/></rootfiles></container>')
          opf = ('<?xml version="1.0" encoding="utf-8"?>'
            '<package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="bookid">'
            '<metadata xmlns:dc="http://purl.org/dc/elements/1.1/">'
            '<dc:identifier id="bookid">urn:uuid:bookrio-ci</dc:identifier>'
            '<dc:title>Bookrio CI EPUB</dc:title><dc:creator>CI</dc:creator>'
            '<dc:language>en</dc:language></metadata>'
            '<manifest>'
            '<item id="c1" href="chapter1.xhtml" media-type="application/xhtml+xml"/>'
            '<item id="c2" href="chapter2.xhtml" media-type="application/xhtml+xml"/>'
            '</manifest>'
            '<spine><itemref idref="c1"/><itemref idref="c2"/></spine></package>')
          def chapter(n, body):
              paras = ''.join(f'<p>{body} Setning {i} som fyller ut siden.</p>' for i in range(1, 80))
              return (f'<?xml version="1.0" encoding="utf-8"?>'
                      f'<html xmlns="http://www.w3.org/1999/xhtml"><head><title>Kapittel {n}</title>'
                      f'</head><body><h1>Kapittel {n}</h1>{paras}</body></html>')
          with zipfile.ZipFile('/tmp/bookrio-sample.epub', 'w', zipfile.ZIP_DEFLATED) as z:
              z.writestr('mimetype', 'application/epub+zip')
              z.writestr('META-INF/container.xml', container)
              z.writestr('OEBPS/content.opf', opf)
              z.writestr('OEBPS/chapter1.xhtml', chapter(1, 'Dette er forste kapittel.'))
              z.writestr('OEBPS/chapter2.xhtml', chapter(2, 'Dette er andre kapittel.'))
          PY
          CONTAINER=$(xcrun simctl get_app_container "$SIM_UDID" com.bookrio.ios data)
          cp /tmp/bookrio-sample.epub "$CONTAINER/Documents/books/sample.epub"
          xcrun simctl terminate "$SIM_UDID" com.bookrio.ios || true
          SIMCTL_CHILD_BOOKRIO_AUTO_OPEN_EPUB="$CONTAINER/Documents/books/sample.epub" \
            xcrun simctl launch --console-pty "$SIM_UDID" com.bookrio.ios > /tmp/app-console-epub.log 2>&1 &
          SIMCTL_PID=$!
          sleep 20
          if ! kill -0 "$SIMCTL_PID" 2>/dev/null; then
            echo "::error::App exited early during EPUB smoke test (likely crashed)"
            cat /tmp/app-console-epub.log
            exit 1
          fi
          xcrun simctl io "$SIM_UDID" screenshot /tmp/bookrio-epub.png
          echo "--- app console (tail) ---"
          tail -80 /tmp/app-console-epub.log
          if grep -q "Uncaught Kotlin exception" /tmp/app-console-epub.log; then
            echo "::error::Uncaught Kotlin exception in the app (see console above)"
            exit 1
          fi
          if ! grep -q "presentEpubReader=true" /tmp/app-console-epub.log; then
            echo "::error::Native EPUB page-curl reader was not presented (see console above)"
            exit 1
          fi
          echo "OK: native EPUB page-curl reader presented on the simulator"

      - name: Upload EPUB simulator screenshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Bookrio-ios-epub-screenshot
          path: /tmp/bookrio-epub.png
          if-no-files-found: warn

      # Podcast runtime check: serve the same tiny RSS fixture over local HTTP
      # (python3 stdlib, no new dependency) and launch the app with
      # BOOKRIO_AUTO_SUBSCRIBE_RSS so the common parser + Room podcast tables +
      # podcast_playback path are exercised on the Simulator.
      - name: Smoke-run app on Simulator (auto-subscribe RSS)
        if: success()
        run: |
          set -euo pipefail
          mkdir -p /tmp/bookrio-podcast
          cat > /tmp/bookrio-podcast/feed.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <rss version="2.0" xmlns:itunes="http://www.itunes.com/dtds/podcast-1.0.dtd">
           <channel>
            <title>Bookrio CI Podcast</title>
            <itunes:author>CI</itunes:author>
            <description>A tiny CI feed.</description>
            <item>
             <title>Episode one</title>
             <guid>bookrio-ci-ep-1</guid>
             <enclosure url="https://example.com/ep1.mp3" length="123456" type="audio/mpeg"/>
             <pubDate>Tue, 01 Oct 2024 10:00:00 GMT</pubDate>
             <itunes:duration>90</itunes:duration>
            </item>
            <item>
             <title>Episode two</title>
             <guid>bookrio-ci-ep-2</guid>
             <enclosure url="https://example.com/ep2.mp3" length="223456" type="audio/mpeg"/>
             <pubDate>Wed, 02 Oct 2024 11:30:00 GMT</pubDate>
             <itunes:duration>01:30</itunes:duration>
            </item>
           </channel>
          </rss>
          XML
          # The macOS runner cannot reliably serve/host local HTTP (the helper
          # server was up but loopback connections were refused), so drive the
          # parser + Room persistence from a file inside the app container instead.
          CONTAINER=$(xcrun simctl get_app_container "$SIM_UDID" com.bookrio.ios data)
          cp /tmp/bookrio-podcast/feed.xml "$CONTAINER/Documents/ci-feed.xml"
          xcrun simctl terminate "$SIM_UDID" com.bookrio.ios || true
          SIMCTL_CHILD_BOOKRIO_AUTO_SUBSCRIBE_RSS_FILE="$CONTAINER/Documents/ci-feed.xml" \
            xcrun simctl launch --console-pty "$SIM_UDID" com.bookrio.ios > /tmp/app-console-podcast.log 2>&1 &
          SIMCTL_PID=$!
          sleep 20
          if ! kill -0 "$SIMCTL_PID" 2>/dev/null; then
            echo "::error::App exited early during podcast smoke test (likely crashed)"
            cat /tmp/app-console-podcast.log
            exit 1
          fi
          xcrun simctl io "$SIM_UDID" screenshot /tmp/bookrio-podcast.png
          echo "--- app console (tail) ---"
          tail -80 /tmp/app-console-podcast.log
          if grep -q "Uncaught Kotlin exception" /tmp/app-console-podcast.log; then
            echo "::error::Uncaught Kotlin exception in the app (see console above)"
            exit 1
          fi
          if ! grep -q "podcastSubscribe=ok" /tmp/app-console-podcast.log; then
            echo "::error::Podcast subscribe failed (see console above)"
            exit 1
          fi
          if ! grep -q "podcastEpisodes=2" /tmp/app-console-podcast.log; then
            echo "::error::Podcast episodes were not stored (see console above)"
            exit 1
          fi
          echo "OK: podcast subscribed and stored on the simulator"

      - name: Upload podcast simulator screenshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Bookrio-ios-podcast-screenshot
          path: /tmp/bookrio-podcast.png
          if-no-files-found: warn

      - name: Upload simulator screenshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Bookrio-ios-simulator-screenshot
          path: /tmp/bookrio-reader.png
          if-no-files-found: warn