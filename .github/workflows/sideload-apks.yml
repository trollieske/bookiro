name: Sideload APKs

# Builds installable release APKs for both flavors and attaches them to a GitHub
# Release, so the side-load (`full`) build can be handed out directly.
#
# Run it from the Actions tab (workflow_dispatch) or push a `v*` tag. The APKs are
# always uploaded as workflow artifacts; a GitHub Release is created/updated too.
#
# Signing: if the BOOKIRO_* upload-key secrets are present the APKs are
# production-signed; otherwise the build falls back to the debug key and the
# artifacts are TEST-only.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.0.0-test)"
        required: false
        default: "sideload-latest"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-apks:
    name: Build & publish APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "${SDKMANAGER}" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -n 1)"
          fi
          test -n "${SDKMANAGER}"
          test -x "${SDKMANAGER}"

          set +o pipefail
          yes | "${SDKMANAGER}" "platforms;android-36" "build-tools;36.0.0"
          SDK_EXIT=${PIPESTATUS[1]}
          set -o pipefail

          if [ "${SDK_EXIT}" -ne 0 ]; then
            echo "sdkmanager failed with exit code ${SDK_EXIT}"
            exit "${SDK_EXIT}"
          fi

      - name: Ensure debug keystore
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Materialize upload keystore (if provided)
        env:
          KEYSTORE_B64: ${{ secrets.BOOKIRO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/bookiro-release.jks"
          fi

      - name: Build release APKs
        env:
          # Production signing wins when the secrets exist; otherwise debug/TEST.
          BOOKIRO_ALLOW_DEBUG_SIGNING: "true"
          BOOKIRO_KEYSTORE_PATH: ${{ runner.temp }}/bookiro-release.jks
          BOOKIRO_KEYSTORE_PASSWORD: ${{ secrets.BOOKIRO_KEYSTORE_PASSWORD }}
          BOOKIRO_KEY_ALIAS: ${{ secrets.BOOKIRO_KEY_ALIAS }}
          BOOKIRO_KEY_PASSWORD: ${{ secrets.BOOKIRO_KEY_PASSWORD }}
        run: ./gradlew :app:assembleFullRelease :app:assemblePlaystoreRelease

      - name: Playstore APK must be torrent-free
        run: >
          tools/verify_playstore_variant.sh
          app/build/outputs/apk/playstore/release/app-playstore-universal-release.apk

      - name: Collect APKs
        run: |
          mkdir -p dist
          # full (side-load / private) — universal + per-ABI
          cp app/build/outputs/apk/full/release/app-full-universal-release.apk    dist/Bookiro-full-universal.apk
          cp app/build/outputs/apk/full/release/app-full-arm64-v8a-release.apk   dist/Bookiro-full-arm64-v8a.apk
          cp app/build/outputs/apk/full/release/app-full-armeabi-v7a-release.apk dist/Bookiro-full-armeabi-v7a.apk
          cp app/build/outputs/apk/full/release/app-full-x86_64-release.apk      dist/Bookiro-full-x86_64.apk
          # playstore (Google Play-safe) — universal + per-ABI
          cp app/build/outputs/apk/playstore/release/app-playstore-universal-release.apk    dist/Bookiro-playstore-universal.apk
          cp app/build/outputs/apk/playstore/release/app-playstore-arm64-v8a-release.apk   dist/Bookiro-playstore-arm64-v8a.apk
          cp app/build/outputs/apk/playstore/release/app-playstore-armeabi-v7a-release.apk dist/Bookiro-playstore-armeabi-v7a.apk
          cp app/build/outputs/apk/playstore/release/app-playstore-x86_64-release.apk      dist/Bookiro-playstore-x86_64.apk
          ls -la dist

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bookiro-apks
          path: dist/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          name: Bookiro ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          files: dist/*.apk
          fail_on_unmatched_files: true
          body: |
            Auto-built sideload APKs.

            - **`Bookiro-full-*.apk`** — full / private build, **with** torrent
              (`com.bookiro`). Use `arm64-v8a` on modern phones; `universal` works
              everywhere.
            - **`Bookiro-playstore-*.apk`** — Play-safe build, **no** torrent
              (`com.bookiro.play`). Mirrors what Google Play would receive.

            > If the `BOOKIRO_*` upload-key secrets are not configured, these APKs are
            > signed with the Android debug key and are **TEST-only**.
